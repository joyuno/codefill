name: Deploy to AWS

on:
  push:
    branches: [main]  # 배포는 main에서만

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY_BACKEND: codefill-backend
  ECR_REPOSITORY_FRONTEND: codefill-frontend

jobs:
  # Backend 빌드 & 푸시
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_BACKEND }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_BACKEND }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  # Frontend 빌드 & 푸시
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_FRONTEND }}:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_CLARITY_ID=${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Backend EC2 배포
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build-backend]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST_BACKEND }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY_BACKEND
          script: |
            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 기존 컨테이너 정지 및 삭제
            docker stop backend 2>/dev/null || true
            docker rm backend 2>/dev/null || true

            # 최신 이미지 pull
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

            # Backend 컨테이너 실행
            docker run -d \
              --name backend \
              --restart unless-stopped \
              -p 8000:8000 \
              -e SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
              -e SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}" \
              -e SUPABASE_SERVICE_ROLE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_ALGORITHM="${{ secrets.JWT_ALGORITHM }}" \
              -e ACCESS_TOKEN_EXPIRE_MINUTES="${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}" \
              -e REFRESH_TOKEN_EXPIRE_DAYS="${{ secrets.REFRESH_TOKEN_EXPIRE_DAYS }}" \
              -e FRONTEND_URL="${{ secrets.FRONTEND_URL }}" \
              -e OPENROUTER_API_KEY="${{ secrets.OPENROUTER_API_KEY }}" \
              -e OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}" \
              -e DEBUG="${{ secrets.DEBUG }}" \
              -e APP_NAME="${{ secrets.APP_NAME }}" \
              -e APP_VERSION="${{ secrets.APP_VERSION }}" \
              -e RATE_LIMIT_PER_MINUTE="${{ secrets.RATE_LIMIT_PER_MINUTE }}" \
              -e KAKAO_CLIENT_ID="${{ secrets.KAKAO_CLIENT_ID }}" \
              -e KAKAO_CLIENT_SECRET="${{ secrets.KAKAO_CLIENT_SECRET }}" \
              -e KAKAO_REDIRECT_URI="${{ secrets.KAKAO_REDIRECT_URI }}" \
              -e GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              -e GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              -e GOOGLE_REDIRECT_URI="${{ secrets.GOOGLE_REDIRECT_URI }}" \
              -e GITHUB_CLIENT_ID="${{ secrets.GH_CLIENT_ID }}" \
              -e GITHUB_CLIENT_SECRET="${{ secrets.GH_CLIENT_SECRET }}" \
              -e GITHUB_REDIRECT_URI="${{ secrets.GH_REDIRECT_URI }}" \
              -e JUDGE0_URL="${{ secrets.JUDGE0_URL }}" \
              -e JUDGE0_API_KEY="${{ secrets.JUDGE0_API_KEY }}" \
              -e JUDGE0_API_HOST="${{ secrets.JUDGE0_API_HOST }}" \
              -e AZURE_TRANSLATOR_KEY="${{ secrets.AZURE_TRANSLATOR_KEY }}" \
              -e AZURE_TRANSLATOR_REGION="${{ secrets.AZURE_TRANSLATOR_REGION }}" \
              -e AZURE_TRANSLATOR_ENDPOINT="${{ secrets.AZURE_TRANSLATOR_ENDPOINT }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e DIRECT_URL="${{ secrets.DIRECT_URL }}" \
              -e LANGCHAIN_TRACING_V2="${{ secrets.LANGCHAIN_TRACING_V2 }}" \
              -e LANGCHAIN_API_KEY="${{ secrets.LANGCHAIN_API_KEY }}" \
              -e LANGCHAIN_PROJECT="${{ secrets.LANGCHAIN_PROJECT }}" \
              -e CORS_ORIGINS="${{ secrets.CORS_ORIGINS }}" \
              $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest

            # 오래된 이미지 정리
            docker image prune -af --filter "until=24h"

            echo "Backend deployment completed!"

  # Frontend EC2 배포
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build-frontend]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy Frontend to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST_FRONTEND }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY_FRONTEND
          script: |
            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 기존 컨테이너 정지 및 삭제
            docker stop codefill-frontend 2>/dev/null || true
            docker rm codefill-frontend 2>/dev/null || true

            # 최신 이미지 pull
            docker pull $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

            # Frontend 컨테이너 실행
            docker run -d \
              --name codefill-frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest

            # 오래된 이미지 정리
            docker image prune -af --filter "until=24h"

            echo "Frontend deployment completed!"
