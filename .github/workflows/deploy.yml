# ========================================
# CD (Continuous Deployment) - AWS 배포
# ========================================
#
# 언제 실행되나요?
#   - main 브랜치에 push 되고
#   - CI가 성공한 후
#
# 무엇을 하나요?
#   1. Docker 이미지 빌드
#   2. AWS ECR에 이미지 푸시
#   3. EC2에 SSH로 접속해서 배포
#
# 필요한 GitHub Secrets:
#   - AWS_ACCESS_KEY_ID
#   - AWS_SECRET_ACCESS_KEY
#   - AWS_REGION (예: ap-northeast-2)
#   - EC2_HOST (EC2 퍼블릭 IP)
#   - EC2_USER (보통 ubuntu 또는 ec2-user)
#   - EC2_SSH_KEY (EC2 SSH 프라이빗 키)
#   - NEXT_PUBLIC_SUPABASE_URL
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY
#   - 기타 환경변수들...
#
# ========================================

name: CD - AWS 배포

on:
  push:
    branches: [main]
  workflow_dispatch:  # 수동 실행 가능

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY_BACKEND: codefill-backend
  ECR_REPOSITORY_FRONTEND: codefill-frontend

jobs:
  # ----------------------------------------
  # Docker 이미지 빌드 & ECR 푸시
  # ----------------------------------------
  build-and-push:
    name: 🐳 빌드 & ECR 푸시
    runs-on: ubuntu-latest

    outputs:
      backend-image: ${{ steps.build-backend.outputs.image }}
      frontend-image: ${{ steps.build-frontend.outputs.image }}

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v5

      - name: 🔐 AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 ECR 로그인
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Backend 이미지 빌드 & 푸시
        id: build-backend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest \
                       ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_BACKEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: 🏗️ Frontend 이미지 빌드 & 푸시
        id: build-frontend
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }} \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest \
            .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY_FRONTEND:$IMAGE_TAG" >> $GITHUB_OUTPUT

  # ----------------------------------------
  # EC2 배포
  # ----------------------------------------
  deploy:
    name: 🚀 EC2 배포
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v5

      - name: 🔐 AWS 인증
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 ECR 로그인 정보 가져오기
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🚀 EC2에 배포
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY
          script: |
            # ECR 로그인
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY

            # 기존 컨테이너 정리
            docker stop codefill-backend codefill-frontend || true
            docker rm codefill-backend codefill-frontend || true

            # 최신 이미지 pull
            docker pull $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:latest
            docker pull $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

            # Backend 실행
            docker run -d \
              --name codefill-backend \
              --restart unless-stopped \
              -p 8000:8000 \
              -e SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
              -e SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
              -e SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              -e SUPABASE_DB_URL=${{ secrets.SUPABASE_DB_URL }} \
              -e JWT_SECRET=${{ secrets.JWT_SECRET }} \
              -e OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }} \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e JUDGE0_URL=${{ secrets.JUDGE0_URL }} \
              -e JUDGE0_API_KEY=${{ secrets.JUDGE0_API_KEY }} \
              -e JUDGE0_API_HOST=${{ secrets.JUDGE0_API_HOST }} \
              $ECR_REGISTRY/${{ env.ECR_REPOSITORY_BACKEND }}:latest

            # Frontend 실행
            docker run -d \
              --name codefill-frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              $ECR_REGISTRY/${{ env.ECR_REPOSITORY_FRONTEND }}:latest

            # 정리
            docker image prune -f

            echo "✅ 배포 완료!"

      - name: ✅ 배포 확인
        run: |
          echo "🎉 배포가 완료되었습니다!"
          echo "Frontend: http://${{ secrets.EC2_HOST }}:3000"
          echo "Backend: http://${{ secrets.EC2_HOST }}:8000"
