name: CI

on:
  push:
    branches: [main, dev, ehw]
  pull_request:
    branches: [main, dev]

jobs:
  # Frontend 검사
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript 타입 체크
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

  # Backend 검사
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "./backend/requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check syntax errors
        run: python -m py_compile app/main.py
