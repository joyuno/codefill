# ========================================
# CI (Continuous Integration) - 테스트 & 빌드 검증
# ========================================
#
# 언제 실행되나요?
#   - main 브랜치로 PR 생성 시
#   - main 브랜치에 push 시
#
# 무엇을 하나요?
#   1. 코드 문법 검사 (lint)
#   2. 빌드가 되는지 확인
#   3. (선택) 테스트 실행
#
# ========================================

name: CI - 테스트 & 빌드

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ----------------------------------------
  # Frontend 검사
  # ----------------------------------------
  frontend:
    name: 🎨 Frontend (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v5

      - name: 📦 Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: 📚 의존성 설치
        working-directory: .
        run: npm ci

      - name: 🔍 린트 검사
        working-directory: .
        run: npm run lint

      - name: 🏗️ 빌드 테스트
        working-directory: .
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ----------------------------------------
  # Backend 검사
  # ----------------------------------------
  backend:
    name: 🐍 Backend (FastAPI)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v5

      - name: 🐍 Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './backend/requirements.txt'

      - name: 📚 의존성 설치
        working-directory: ./backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 문법 검사 (선택적)
        working-directory: ./backend
        run: |
          pip install ruff
          ruff check . --ignore E501 || true  # 경고만 표시, 실패하지 않음

      - name: 🧪 테스트 실행 (있을 경우)
        working-directory: ./backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          JWT_SECRET: test-secret-for-ci
        run: |
          if [ -d "tests" ]; then
            pytest tests/ -v || true
          else
            echo "테스트 디렉토리 없음 - 스킵"
          fi

  # ----------------------------------------
  # Docker 빌드 테스트
  # ----------------------------------------
  docker:
    name: 🐳 Docker 빌드 테스트
    runs-on: ubuntu-latest
    needs: [frontend, backend]  # frontend, backend 성공 후 실행

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v5

      - name: 🐳 Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Backend Docker 빌드
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false  # 빌드만 테스트, 푸시 안함
          tags: codefill-backend:test

      - name: 🏗️ Frontend Docker 빌드
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: codefill-frontend:test
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_API_URL=http://localhost:8000
